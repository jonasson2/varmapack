[build-system]
requires = [
  "meson-python>=0.16",
  "meson>=1.3",
  "ninja",
  "numpy>=2,<2.3; python_version < '3.14' and platform_machine == 'aarch64'",
  "numpy>=2,<2.3; python_version == '3.10' and platform_machine != 'aarch64'",
  "numpy>=2,<2.5; python_version >= '3.11' and python_version < '3.14' and platform_machine != 'aarch64'",
  "numpy>=2.5; python_version >= '3.14'",
  "randompack>=0.1.9",
  "cython",
]
build-backend = "mesonpy"

[project]
name = "varmapack"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "SCIPY-OPENBLAS-LICENSE.txt"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "randompack>=0.1.9",
]
readme = { file = "README.md", content-type = "text/markdown" }
description = "VARMA time-series simulation library"

[project.urls]
Homepage = "https://github.com/jonasson2/varmapack"
Documentation = "https://varmapack.readthedocs.io/"
Repository = "https://github.com/jonasson2/varmapack"
Issues = "https://github.com/jonasson2/varmapack/issues"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "*t-*"]
build-frontend = { name = "build", args = ["--no-isolation"] }
before-build = """
python -m pip install -r {package}/tools/wheel-requirements.txt
"""
test-command = "python {package}/tools/run-wheel-tests.py {package}/tests"

[tool.cibuildwheel.linux]
repair-wheel-command = [
  "python {package}/tools/repair-wheel.py {wheel} {dest_dir}",
]

[tool.cibuildwheel.windows]
repair-wheel-command = [
  "python {package}/tools/repair-wheel.py {wheel} {dest_dir}",
]
