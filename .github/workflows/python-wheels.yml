name: Python wheels

on:
  workflow_dispatch:
    inputs:
      build:
        description: cibuildwheel build selector
        required: true
        default: "cp313-*"
  release:
    types: [published]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            arch: x86_64
            blas: scipy-openblas
            release_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            manual_build: ""
            image: ""
            artifact: wheels-linux-x86_64
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            arch: aarch64
            blas: scipy-openblas
            release_build: "cp310-* cp311-* cp312-* cp313-*"
            manual_build: "cp310-* cp311-* cp312-* cp313-*"
            image: manylinux2014
            artifact: wheels-linux-aarch64
          - name: Linux ARM64 CPython 3.14
            runner: ubuntu-22.04-arm
            arch: aarch64
            blas: scipy-openblas
            release_build: "cp314-*"
            manual_build: "cp314-*"
            image: manylinux_2_28
            artifact: wheels-linux-aarch64-cp314
          - name: macOS ARM64
            runner: macos-14
            arch: arm64
            blas: accelerate
            release_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            manual_build: ""
            image: ""
            artifact: wheels-macos-arm64
          - name: macOS x86_64
            runner: macos-15-intel
            arch: x86_64
            blas: accelerate
            release_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            manual_build: ""
            image: ""
            artifact: wheels-macos-x86_64
          - name: Windows AMD64
            runner: windows-latest
            arch: AMD64
            blas: scipy-openblas
            release_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            manual_build: ""
            image: ""
            artifact: wheels-windows-amd64

    env:
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD: >-
        ${{ github.event_name == 'release' && matrix.release_build ||
            matrix.manual_build || inputs.build }}
      CIBW_CONFIG_SETTINGS: setup-args=-Dblas_order=${{ matrix.blas }}
      CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel

      - name: Install macOS Fortran compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          FC=$(ls "$(brew --prefix)/bin"/gfortran-* | head -n1)
          echo "FC=$FC" >> "$GITHUB_ENV"

      - name: Build wheels
        run: python -m cibuildwheel python/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 7
